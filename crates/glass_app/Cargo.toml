[package]
name = "glass_app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = ["editor"]
editor = [
    "dep:glass_editor",
    "dep:egui",
    "dep:egui-winit",
    "dep:egui-ash-renderer",
]

[dependencies]
glass_core.workspace = true
glass_renderer.workspace = true
glass_scripting.workspace = true
glass_audio.workspace = true
glass_physics.workspace = true
glass_particles.workspace = true
ash.workspace = true
gpu-allocator.workspace = true
winit.workspace = true
libc = "0.2"
log.workspace = true
env_logger.workspace = true

# Dependencias opcionales exclusivas del Modo Editor (desactivadas en Standalone Game Runtime)
glass_editor = { workspace = true, optional = true }
glass_mcp.workspace = true
egui = { workspace = true, optional = true }
egui-winit = { workspace = true, optional = true }
egui-ash-renderer = { workspace = true, optional = true }
serde_json.workspace = true
gilrs = "0.10"
image.workspace = true
