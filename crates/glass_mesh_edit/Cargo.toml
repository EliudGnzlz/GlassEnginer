[package]
name = "glass_mesh_edit"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
log.workspace = true
thiserror.workspace = true
# Kernel C++ Manifold: el build script de manifold-csg-sys lo descarga y compila
# (requiere red en el primer build; la caché de cargo lo reutiliza después).
manifold3d = "0.4"
# Lectura de .glb (el escritor es a mano en gltf_io.rs).
gltf.workspace = true
# Las features son aditivas: si el workspace ya activa `derive`, esto no cambia nada.
serde = { workspace = true, features = ["derive"] }
# Lo usa Recipe (to_json/from_json) en código de producción, no solo en tests.
serde_json.workspace = true
