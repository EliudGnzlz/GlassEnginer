[package]
name = "glass_editor"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
glass_core.workspace = true
glass_launcher.workspace = true
glass_mesh_edit.workspace = true
glass_renderer.workspace = true
glass_mcp.workspace = true
glass_audio.workspace = true
glass_scripting.workspace = true
ash.workspace = true
gpu-allocator.workspace = true
egui.workspace = true
egui-winit.workspace = true
egui-ash-renderer.workspace = true
log.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
egui_dock = "0.21.1"
# Actualizaciones del Launcher desde GitHub Releases (módulo
# `updates`): cliente HTTP con TLS, lectura de .zip, SHA-256 y
# comparación de versiones propia (3 o 4 componentes, ver updates.rs).
ureq = "3"
# Diálogos nativos del sistema (selector de carpetas del botón «Abrir»
# del Hub). En Linux el backend por defecto es xdg-portal (sin
# dependencias nativas de compilación); en Windows y macOS, el diálogo
# nativo de cada sistema.
rfd = "0.15"
zip = "8"
sha2.workspace = true
