[workspace]
members = [
    "crates/glass_core",
    "crates/glass_renderer",
    "crates/glass_editor",
    "crates/glass_scripting",
    "crates/glass_mcp",
    "crates/glass_audio",
    "crates/glass_physics",
    "crates/glass_particles",
    "crates/glass_app",
    "crates/glass_mesh_edit",
    "crates/glass_launcher",
    "crates/glass_hub",
    "crates/glass_fbx",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["GlassEngine Team"]
license = "MIT OR Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
log = "0.4"
env_logger = "0.11"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
raw-window-handle = "0.6"
winit = "0.30"
ash = "0.38"
ash-window = "0.13.0"
gpu-allocator = { version = "0.28", default-features = false, features = ["vulkan"] }
egui = "0.36"
egui-winit = "0.36"
egui-ash-renderer = { version = "0.13", features = ["gpu-allocator"] }
gltf = "1.4"
notify = "8.0"
sha2 = "0.10"
rapier3d = { version = "0.23", default-features = false, features = ["dim3", "f32"] }
kira = { version = "0.10", default-features = false, features = ["cpal", "wav"] }
crossbeam-queue = "0.3"
crossbeam = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
glass_core = { path = "crates/glass_core" }
glass_renderer = { path = "crates/glass_renderer" }
glass_editor = { path = "crates/glass_editor" }
glass_scripting = { path = "crates/glass_scripting" }
glass_mcp = { path = "crates/glass_mcp" }
glass_audio = { path = "crates/glass_audio" }
glass_physics = { path = "crates/glass_physics" }
glass_particles = { path = "crates/glass_particles" }
glass_mesh_edit = { path = "crates/glass_mesh_edit" }
glass_launcher = { path = "crates/glass_launcher" }
