# Workflow de Release: compila Windows y Linux, genera instaladores y publica el release.
#
# Nota: no se define RUSTFLAGS con -D warnings. Es la primera build de Windows de la
# historia del proyecto; lo que importa son los errores reales, no los warnings.
#
# Nota: la parte C# se compila con `dotnet build` SIN -c Release, así que la salida queda
# en bin/Debug/net8.0. Es intencionado: la app resuelve la DLL en esa ruta relativa al
# directorio de trabajo, aunque el binario Rust sea release.
#
# Familias de release (S8): el motor se publica con tags `v*` y el Hub con tags
# `hub-v*` (la versión del Hub tiene vida propia). Cada job monta DOS stagings con
# el mismo contenido: `dist/hub` (lo que instala el setup y lo que llevan el
# AppImage y el zip del Launcher) y `dist/engine` (el payload del motor
# gestionado). Este workflow SÍ genera un .zip de Windows, pero solo el del
# MOTOR: GlassEnginer-Engine-<versión>-windows-x64.zip, con el payload en la
# raíz (contrato de updates.rs). El .zip del Launcher para Windows sigue sin
# existir: en Windows el Launcher se instala con el setup .exe, que además
# siembra el motor en la zona de datos (engines/<versión>/ + engines.json).

name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiqueta del release (v… = motor, hub-v… = Hub)"
        type: string
        default: "v0.10.14.1-beta"
  push:
    tags:
      - "v*"
      - "hub-v*"

permissions:
  contents: read

env:
  # Tag efectivo: input en workflow_dispatch, nombre del tag en push.
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Versión (tag sin la "v" ni el "hub-v")
        shell: pwsh
        run: |
          $version = $env:TAG -replace '^hub-v', '' -replace '^v', ''
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compilar glass_app (release)
        run: cargo build --release -p glass_app --locked

      - name: Compilar GlassEngine.Core (sin -c, queda en bin/Debug/net8.0)
        run: dotnet build managed/GlassEngine.Core/GlassEngine.Core.csproj

      - name: Montar payloads en dist/hub y dist/engine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($payload in @('dist/hub', 'dist/engine')) {
            New-Item -ItemType Directory -Force -Path $payload | Out-Null

            # Binario
            Copy-Item 'target/release/glass_app.exe' -Destination $payload

            # Carpeta managed completa (DLL + runtimeconfig + dependencias)
            $managedParent = "$payload/managed/GlassEngine.Core/bin/Debug"
            New-Item -ItemType Directory -Force -Path $managedParent | Out-Null
            Copy-Item 'managed/GlassEngine.Core/bin/Debug/net8.0' -Destination $managedParent -Recurse

            # Recursos de runtime, sin las fuentes crudas del pack
            Copy-Item 'assets' -Destination "$payload/assets" -Recurse
            $proto = "$payload/assets/polygon-prototype"
            if (Test-Path $proto) { Remove-Item $proto -Recurse -Force }

            # El bridge de conversión .blend/.fbx -> .glb: sin él en el
            # payload, la build instalada no puede convertir modelos al
            # soltarlos en la escena (regresión detectada el 2026-11-18).
            New-Item -ItemType Directory -Force -Path "$payload/tools" | Out-Null
            Copy-Item 'tools/headless_blender_bridge.py' -Destination "$payload/tools"

            if (-not (Test-Path "$payload/managed/GlassEngine.Core/bin/Debug/net8.0/GlassEngine.Core.dll")) {
              throw "Falta GlassEngine.Core.dll en el payload $payload"
            }
          }

      - name: Compilar instalador con Inno Setup
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            Write-Error "No se encontró Inno Setup 6 en '$iscc'. El runner no lo trae; instálalo (p. ej. 'choco install innosetup') antes de este paso."
            exit 1
          }
          $root = (Get-Location).Path
          # La siembra del motor solo va en los releases del motor (v*): en un
          # release del Hub (hub-v*) la carpeta sembrada llevaría la versión
          # del Hub, que no es la del motor que contiene.
          $seedArgs = @()
          if ($env:TAG -notlike 'hub-v*') { $seedArgs = @("/DEngineSeedDir=$root\dist\engine") }
          & $iscc "/DAppVersion=$env:VERSION" "/DPayloadDir=$root\dist\hub" @seedArgs "/DOutputDir=$root\dist" "installer\GlassEnginer.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC falló con código $LASTEXITCODE" }

      - name: Crear zip del motor (payload en la raíz)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zipName = "GlassEnginer-Engine-$env:VERSION-windows-x64.zip"
          Compress-Archive -Path 'dist/engine/*' -DestinationPath "dist/$zipName" -CompressionLevel Optimal
          # El instalador del motor exige el ejecutable en la raíz del paquete.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead("$PWD/dist/$zipName")
          try {
            $names = $archive.Entries | ForEach-Object { $_.FullName -replace '\\', '/' }
            if ($names -notcontains 'glass_app.exe') { throw "glass_app.exe no está en la raíz de $zipName" }
          } finally {
            $archive.Dispose()
          }
          Get-Item "dist/$zipName" | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: |
            dist/*.exe
            dist/GlassEnginer-Engine-*-windows-x64.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Dependencias del sistema (mismas que el CI)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvulkan-dev mesa-vulkan-drivers libxkbcommon-dev libxkbcommon-x11-0 \
            libudev-dev libx11-dev libxcb1-dev libwayland-dev libasound2-dev \
            pkg-config xvfb

      - name: Versión (tag sin la "v" ni el "hub-v")
        run: |
          v="${TAG#hub-v}"
          echo "VERSION=${v#v}" >> "$GITHUB_ENV"

      - name: Compilar glass_app (release)
        run: cargo build --release -p glass_app --locked

      - name: Compilar GlassEngine.Core (sin -c, queda en bin/Debug/net8.0)
        run: dotnet build managed/GlassEngine.Core/GlassEngine.Core.csproj

      - name: Montar payloads en dist/hub y dist/engine
        run: |
          set -euo pipefail
          for payload in dist/hub dist/engine; do
            mkdir -p "$payload/managed/GlassEngine.Core/bin/Debug"

            # Binario
            cp target/release/glass_app "$payload/"

            # Carpeta managed completa
            cp -a managed/GlassEngine.Core/bin/Debug/net8.0 "$payload/managed/GlassEngine.Core/bin/Debug/"

            # Recursos de runtime, sin las fuentes crudas del pack
            cp -a assets "$payload/assets"
            rm -rf "$payload/assets/polygon-prototype"

            # El bridge de conversión .blend/.fbx -> .glb: sin él en el
            # payload, la build instalada no puede convertir modelos al
            # soltarlos en la escena (regresión detectada el 2026-11-18).
            mkdir -p "$payload/tools"
            cp tools/headless_blender_bridge.py "$payload/tools/"

            test -f "$payload/managed/GlassEngine.Core/bin/Debug/net8.0/GlassEngine.Core.dll"
          done

      - name: Crear zips (payload en la raíz)
        run: |
          set -euo pipefail
          launcher_zip="GlassEnginer-Launcher-${VERSION}-linux-x64.zip"
          (cd dist/hub && zip -r -q "../${launcher_zip}" .)
          engine_zip="GlassEnginer-Engine-${VERSION}-linux-x64.zip"
          (cd dist/engine && zip -r -q "../${engine_zip}" .)
          # El instalador del motor exige el ejecutable en la raíz del paquete.
          unzip -Z1 "dist/${engine_zip}" | grep -qx 'glass_app'
          ls -l "dist/${launcher_zip}" "dist/${engine_zip}"

      - name: Montar AppDir
        run: |
          set -euo pipefail
          appdir=dist/AppDir
          mkdir -p "$appdir/usr/bin"
          cp -a dist/hub/. "$appdir/usr/bin/"

          cp installer/AppRun "$appdir/AppRun"
          chmod +x "$appdir/AppRun"
          cp installer/glassenginer.desktop "$appdir/glassenginer.desktop"

          # appimagetool exige un icono PNG/SVG con el nombre de Icon= en la raíz del AppDir.
          if [ ! -f installer/glassenginer.png ]; then
            echo "::error::Falta installer/glassenginer.png (icono requerido por appimagetool)"
            exit 1
          fi
          cp installer/glassenginer.png "$appdir/glassenginer.png"

      - name: Generar AppImage
        run: |
          set -euo pipefail
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/12/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          # --appimage-extract-and-run evita depender de FUSE en el runner.
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run \
            dist/AppDir "dist/GlassEnginer-Launcher-${VERSION}-linux-x64.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: paquetes-linux
          path: |
            dist/*.zip
            dist/*.AppImage
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [windows, linux]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "{instalador-windows,paquetes-linux}"
          path: dist
          merge-multiple: true

      - name: Familia y versión del tag
        run: |
          set -euo pipefail
          case "$TAG" in
            hub-v*) echo "FAMILY=hub" >> "$GITHUB_ENV"; echo "VERSION=${TAG#hub-v}" >> "$GITHUB_ENV" ;;
            v*)     echo "FAMILY=engine" >> "$GITHUB_ENV"; echo "VERSION=${TAG#v}" >> "$GITHUB_ENV" ;;
            *) echo "::error::Tag no reconocido: $TAG (se espera v* o hub-v*)"; exit 1 ;;
          esac

      - name: Generar checksums.txt (formato sha256sum)
        working-directory: dist
        run: |
          set -euo pipefail
          if [ "$FAMILY" = "hub" ]; then
            # Release del Hub: solo el instalador y el AppImage. Los paquetes
            # del motor NO se publican aquí: llevarían la versión del Hub y
            # el selector del motor podría confundirlos con un motor.
            sha256sum *.exe *.AppImage > checksums.txt
          else
            sha256sum *.exe *.zip *.AppImage > checksums.txt
          fi
          cat checksums.txt

      - name: Crear release
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$FAMILY" = "hub" ]; then
            cat > notas.md <<EOF
          Versión del Hub de GlassEnginer (${TAG}). Puede contener errores.

          El Hub se ofrece desde la aplicación y solo se descarga cuando el usuario
          hace clic para actualizar: nada se instala automáticamente.

          Artefactos:
          - Instalador de Windows (.exe): instala el Hub y siembra el motor incluido.
          - AppImage de Linux: ejecutable portable del Hub.

          checksums.txt contiene los SHA-256 de los artefactos.
          EOF
            gh release create "$TAG" \
              --title "GlassEnginer Hub $TAG" \
              --prerelease \
              --notes-file notas.md \
              --target "${{ github.sha }}" \
              *.exe *.AppImage checksums.txt
          else
            cat > notas.md <<EOF
          Versión alpha de GlassEnginer Launcher (${TAG}). Puede contener errores.

          Artefactos:
          - Instalador de Windows (.exe): instalación manual en Windows x64; siembra el motor incluido.
          - Paquete Linux (.zip): lo usa el auto-update del Launcher en Linux x64.
          - AppImage de Linux: ejecutable portable para instalación manual en Linux x64.
          - Paquetes del motor gestionado (GlassEnginer-Engine-…-windows-x64.zip y
            …-linux-x64.zip): los instala el Hub al actualizar el motor.

          checksums.txt contiene los SHA-256 de los artefactos.
          EOF
            gh release create "$TAG" \
              --title "GlassEnginer Launcher $TAG" \
              --prerelease \
              --notes-file notas.md \
              --target "${{ github.sha }}" \
              *.exe *.zip *.AppImage checksums.txt
          fi
